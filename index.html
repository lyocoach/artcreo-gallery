      const sign=new T.Mesh(new T.PlaneGeometry(6.4,0.9),new T.MeshBasicMaterial({map:textTex([["아트크레오 의정부 더샵파크 미술교습소",84,FD,"#22262e"],[`${r.no} · ${r.name} ${r.age}`,38,FB,"#2f5d8a"]],1280,180,"#f7f7f4")}));
      sign.position.set(0,4.0,-hw+0.03);grp.add(sign);
      const c=hw-0.75;tree(grp,c,c,1);tree(grp,-c,c,1);tree(grp,c,-c,1.05);tree(grp,-c,-c,1.05);
      const pz=partition(grp,r,n,L),BWp=Math.min(9,L*0.55);stanchions(grp,pz+1.3,BWp*0.8);if(L>=16){plinth(grp,-BWp/2-0.9,pz+0.4,ri);plinth(grp,BWp/2+0.9,pz+0.4,ri+1);}contact(grp,0,pz,BWp/2+0.4,0.5);

      const picks=[],spots=[],arts=[];

        const wi=Math.floor(i/per),si=i%per,cnt=Math.min(per,n-wi*per);const [wx,wz,ry]=walls[wi];

        const ph=0.62+(w.who?0.12:0)+(w.award?0.1:0);const plate=new T.Mesh(new T.PlaneGeometry(1.3,ph),new T.MeshBasicMaterial({map:textTex(pl,780,Math.round(ph*600),"#ffffff")}));plate.position.set(0,-ih/2-0.25-ph/2-0.05,0.01);

          const ros=new T.Mesh(new T.CircleGeometry(0.2,24),rm);ros.position.set(iw/2+0.18,ih/2+0.18,0.07);fg.add(ros);
          const inner=new T.Mesh(new T.CircleGeometry(0.12,24),new T.MeshBasicMaterial({map:(()=>{const cv=document.createElement("canvas");cv.width=cv.height=256;const x=cv.getContext("2d");const top=w.award.startsWith("최우수");x.fillStyle=top?"#a8812f":"#7d858f";x.fillRect(0,0,256,256);x.fillStyle="#fff";x.textAlign="center";x.textBaseline="alphabetic";const s=top?"최우수":"은상";x.font=(top?74:92)+"px "+FD;const m=x.measureText(s);const asc=m.actualBoundingBoxAscent||0,desc=m.actualBoundingBoxDescent||0;x.fillText(s,128,asc+desc?128+(asc-desc)/2:156,220);const tx=new T.CanvasTexture(cv);tx.encoding=T.sRGBEncoding;return tx;})()}));inner.position.set(iw/2+0.18,ih/2+0.18,0.075);fg.add(inner);

      return {r,grp,L,picks,spots,arts,floor:fl,loaded:false};
    });

    const ring=new T.Mesh(new T.RingGeometry(0.28,0.4,40),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false}));ring.rotation.x=-Math.PI/2;scene.add(ring);let ringT=0;
    let room=null,yaw=0,pitch=0,camPos=new T.Vector3(),tgtPos=new T.Vector3(),tgtYaw=0,cur3=-1,dirty=true,fov0=62,zoom=1;
    function setZoom(z){zoom=Math.max(1,Math.min(4,z));cam.fov=fov0/zoom;cam.updateProjectionMatrix();dirty=true;}
    const tabs=box.querySelector("#v3Tabs");
    rooms.forEach((rm,ri)=>{const b=document.createElement("button");b.type="button";b.textContent=`${rm.r.name} ${rm.r.age}`;b.setAttribute("aria-pressed","false");b.onclick=()=>enter(ri);tabs.appendChild(b);});
    function setCap(t,m){box.querySelector("#v3Title").textContent=t;box.querySelector("#v3Meta").textContent=m;}
    function enter(ri){if(room)room.grp.visible=false;room=rooms[ri];room.grp.visible=true;
      [...tabs.children].forEach((b,j)=>b.setAttribute("aria-pressed",String(j===ri)));
      if(!room.loaded){room.loaded=true;room.r.items.forEach((w,i)=>loader.load(w.src,t=>{t.encoding=T.sRGBEncoding;t.anisotropy=Math.min(4,maxAni);room.arts[i].material=new T.MeshBasicMaterial({map:t});room.arts[i].material.color.setScalar(0.96);dirty=true;}));}
      camPos.set(0,1.75,Math.min(room.L/2-1.6,-room.L*0.08+Math.min(9,room.L*0.55)*1.05+2));tgtPos.copy(camPos);yaw=tgtYaw=0;pitch=0;cur3=-1;setZoom(1);
      setCap(`${room.r.no} · ${room.r.name} ${room.r.age}`,`작품 ${room.r.items.length}점 · '다음 작품'을 누르면 차례로 돌아봅니다`);dirty=true;}
    function lookYaw(f,t){const d=t.clone().sub(f);return Math.atan2(-d.x,-d.z);}
    function go(i){const n=room.r.items.length;cur3=(i+n)%n;const sp=room.spots[cur3];tgtPos.copy(sp.from);
      let ty=lookYaw(sp.from,sp.look);while(ty-yaw>Math.PI)ty-=2*Math.PI;while(ty-yaw<-Math.PI)ty+=2*Math.PI;tgtYaw=ty;pitch=0;setZoom(1);
      const w=room.r.items[cur3];setCap(w.title,`${cur3+1} / ${n} · ${w.meta}`);dirty=true;}
    box.querySelector("#v3Prev").onclick=()=>go(cur3<0?room.r.items.length-1:cur3-1);
    box.querySelector("#v3Next").onclick=()=>go(cur3+1);
    const cv=R.domElement;let down=null,moved=false,pinch=null;const pts=new Map();
    const pdist=()=>{const [a,b]=[...pts.values()];return Math.hypot(a.x-b.x,a.y-b.y);};
    cv.addEventListener("pointerdown",e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId);
      if(pts.size===2){pinch={d:pdist(),z:zoom};down=null;moved=true;}else if(pts.size===1){down={x:e.clientX,y:e.clientY,yaw,pitch};moved=false;}});

      if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;
      yaw=tgtYaw=down.yaw+dx*0.005/zoom;pitch=Math.max(-0.6,Math.min(0.6,down.pitch+dy*0.003/zoom));dirty=true;});
    const endPt=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(pts.size===0&&moved)down=null;};
    cv.addEventListener("pointercancel",e=>{endPt(e);down=null;});

    box.querySelector("#v3In").onclick=()=>setZoom(zoom*1.4);box.querySelector("#v3Out").onclick=()=>setZoom(zoom/1.4);
    cv.addEventListener("pointerup",e=>{endPt(e);const d=down;if(pts.size===0)down=null;if(!d||moved)return;const rc=cv.getBoundingClientRect();
      const m=new T.Vector2(((e.clientX-rc.left)/rc.width)*2-1,-((e.clientY-rc.top)/rc.height)*2+1);const ray=new T.Raycaster();ray.setFromCamera(m,cam);
      const hit=ray.intersectObjects(room.picks)[0];if(hit){const ii=hit.object.userData.i;go(ii);openLb(ii,room.r.items);return;}
      const fh=ray.intersectObject(room.floor)[0];if(!fh)return;
      const lim=room.L/2-1.4,x=Math.max(-lim,Math.min(lim,fh.point.x)),z=Math.max(-lim,Math.min(lim,fh.point.z));
      tgtPos.set(x,1.75,z);ring.position.set(x,0.02,z);ring.material.opacity=0.85;ringT=performance.now();
      cur3=-1;setCap(`${room.r.no} · ${room.r.name} ${room.r.age}`,"주변 작품을 둘러보세요. 작품을 누르면 정면에서 봅니다");dirty=true;});
    function size(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;R.setSize(w,h);cam.aspect=w/h;fov0=w<h?75:62;setZoom(zoom);}
